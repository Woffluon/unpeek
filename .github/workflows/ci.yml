name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website-checks:
    name: Website Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build website
        env:
          NEXT_PUBLIC_BASE_PATH: /unpeek
        run: |
          pnpm --filter web run typecheck
          pnpm --filter web run build

  package-and-tests:
    name: Core Lints, Tests, Benchmarks & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Version Consistency
        shell: pwsh
        run: |
          pwsh -File scripts/test-versioning.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/validate-version.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Package
        run: pnpm --filter unpeek run build

      - name: Typecheck Core Package
        run: pnpm --filter unpeek run typecheck

      - name: Unit, E2E & REA Resistance Tests
        run: pnpm --filter unpeek run test:coverage

      - name: Enforce CPU (<2%) & Gzip (<15%) Budgets
        run: pnpm --filter unpeek run bench

      - name: Stage Release Tarball & SHA-256 Checksums
        shell: pwsh
        run: pwsh -File scripts/stage-release.ps1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpeek-CI-Build-${{ matrix.os }}
          path: artifacts/*
