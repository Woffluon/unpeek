<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="auto" fill="none">
  <style>
    .bg { fill: #F2F0E9; }
    .border { stroke: #D5D0C2; }
    .mark { fill: #111111; }
    .wordmark { fill: #111111; }
    .tagline-muted { fill: #5C594F; }
    .tagline-strong { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111111; }
      .border { stroke: #2A2A28; }
      .mark { fill: #EDEAE1; }
      .wordmark { fill: #EDEAE1; }
      .tagline-muted { fill: #8E8A7E; }
      .tagline-strong { fill: #EDEAE1; }
    }
  </style>

  <!-- Adaptive Paper (Light) / Carbon (Dark) Canvas -->
  <rect class="bg" width="960" height="200" rx="6" />
  <rect class="border" x="0.5" y="0.5" width="959" height="199" rx="5.5" />

  <!-- Signal Orange Top Line -->
  <rect x="0" y="0" width="960" height="2" fill="#FF3300" />

  <!-- Iconic Brand Mark (Sealed block with open hot-path cut) -->
  <g transform="translate(458, 30) scale(1.833)">
    <path class="mark" d="M2 2h15l5 5v15H2V2Z" />
    <rect x="0" y="10.5" width="24" height="3" fill="#FF3300" />
  </g>

  <!-- Wordmark -->
  <text class="wordmark" x="480" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.035em">unpeek</text>

  <!-- Tagline -->
  <text class="tagline-muted" x="480" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="-0.01em">
    Nothing to peek at. <tspan class="tagline-strong">Nothing to slow down.</tspan>
  </text>
</svg>
